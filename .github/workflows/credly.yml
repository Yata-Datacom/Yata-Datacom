name: Credly Card
# 触发说明：push（脚本/工作流改动）+ 每日定时 + 手动 dispatch

# 从 Credly 公开接口取数据 → 把徽章图片存成仓库内 PNG → README 标记块直贴 PNG。
# 为什么要自建：第三方徽章服务必须把 Credly 用户名写进图片 URL，公开主页等于把账号名贴出来；
# 而且那些免费实例会冷启动/限流，主页会变破图。（SVG 卡片已弃用：部分客户端渲染不出来）
# 用户名放在仓库 Secret `CREDLY_USER` 里 —— Secret 内容不会出现在公开仓库中。

on:
  schedule:
    - cron: "23 2 * * *"        # 每天 02:23 UTC（北京时间 10:23）刷新
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/gen_credly_card.py"
      - ".github/workflows/credly.yml"

permissions:
  contents: write

concurrency:
  group: credly-card
  cancel-in-progress: false

jobs:
  credly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成 Credly 卡片
        env:
          CREDLY_USER: ${{ secrets.CREDLY_USER }}
          CARD_TITLE: Yata-Datacom
        run: python tools/gen_credly_card.py

      - name: 提交变更
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md          # 徽章 PNG + README 标记块
          if git diff --cached --quiet; then
            echo "徽章无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(credly): 刷新 Credly 徽章卡片 [skip ci]"
          # 期间可能有别的推送（比如刚合并的改动）→ 先 rebase 再推，失败重试 3 次
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "第 $i 次推送失败，3 秒后重试"; sleep 3
          done
          echo "推送失败"; exit 1
