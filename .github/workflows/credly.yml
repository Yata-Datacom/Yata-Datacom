name: Credly Card

# 自建 Credly 徽章统计卡：从 Credly 公开接口取数据 → 渲染成 SVG → 提交回仓库。
# 为什么要自建：第三方徽章服务必须把 Credly 用户名写进图片 URL，公开主页等于把账号名贴出来；
# 而且那些免费实例会冷启动/限流，主页会变破图。
# 用户名放在仓库 Secret `CREDLY_USER` 里 —— Secret 内容不会出现在公开仓库中。

on:
  schedule:
    - cron: "23 2 * * *"        # 每天 02:23 UTC（北京时间 10:23）刷新
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/gen_credly_card.py"
      - ".github/workflows/credly.yml"

permissions:
  contents: write

jobs:
  credly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成 Credly 卡片
        env:
          CREDLY_USER: ${{ secrets.CREDLY_USER }}
          CARD_TITLE: Yata-Datacom
        run: python tools/gen_credly_card.py

      - name: 提交变更
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/credly-badges.svg
          if git diff --cached --quiet; then
            echo "徽章无变化，跳过提交"
          else
            git commit -m "chore(credly): 刷新 Credly 徽章卡片 [skip ci]"
            git push
          fi
